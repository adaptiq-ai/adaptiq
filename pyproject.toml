[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiq"


version = "0.12.9" # Increment this for new releases

description = "An offline Q-learning framework for AI agent prompt optimization."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Youssef ALWAZ / KOSMOS Technologies", email = "alwaz.youssef@kosmostechnologies.fr" },
  { name = "Wassim AMRI / KOSMOS Technologies", email = "w.amri@kosmostechnologies.fr" },
]
keywords = ["ai", "agent", "reinforcement learning", "q-learning", "prompt engineering", "llm", "crewai"] # Helpful for discoverability
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
# Bounds reflect the versions the code is actually validated against.
# crewai < 0.178: `OutputParserException` was removed from `crewai.agents.parser`
# after 0.177.0, which breaks `adaptiq.agents.crew_ai.crew_logger` at import.
# langchain < 1.0: `langchain.prompts` was removed in the 1.x line.
dependencies = [
    "crewai>=0.134,<0.178",
    "crewai_tools>=0.48,<1.0",
    "numpy",
    "pyyaml",
    "python-dotenv",
    "langchain>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "openai-agents>=0.1.0",
    "pydantic>=2,<3",
    "requests>=2,<3",
    "tiktoken>=0.8",
]

[project.scripts]
adaptiq = "adaptiq.cli:main" # Assumes adaptiq/cli.py exists with a main() function

[tool.setuptools]
package-dir = {"" = "src"} # Tells setuptools your package 'adaptiq' is in the 'src' directory

[tool.setuptools.packages.find]
where = ["src"] # Location to find packages
namespaces = false # Usually false unless you are using PEP 420 namespace packages

[tool.setuptools.package-data]
adaptiq = [
    "templates/*",
    "templates/**/*",  # Include all files in templates subdirectories
]

[tool.pytest.ini_options]
# Keep collection scoped to the real test suite: scripts/ holds manual
# validation scripts whose module bodies run on import, not pytest tests.
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.py$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
